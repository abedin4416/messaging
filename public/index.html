<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Textbit</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <link rel="stylesheet" href="styles.css"/>
        <link rel="icon" type="image/png" href="res/icon1.png"/>
    </head>
    <body>
        <div id="header">
            <div id="title">Textbit</div>
            <button id="sign"></button>
        </div>
        <form id="user-form">
            <div id="user-form-msg">
                <h2>Welcome to Textbit.</h2>
                <text id="sign-msg"></text>
            </div>
            <input type="text" id="name" class="user-input" name="fullname" placeholder="Full name" required/>
            <input type="text" class="user-input" name="username" placeholder="Username" required/>
            <input type="password" class="user-input" name="password" placeholder="Password" required/>
            <button type="submit" id="submit">Submit</button>
        </form>
        <script src="scripts/auth.js"></script>
    </body>
</html>
