<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Text-ap</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <link rel="stylesheet" href="styles.css"/>
        <link rel="icon" type="image/png" href="res/icon1.png"/>
    </head>
    <body>
        <div id="header">
            <div id="title">Textbit</div>
        </div>
        <form id="user-form">
            <div id="user-form-msg">
                Sign in to your account
                <br>or <a href="/signup">Create new account</a>
            </div>
            <input type="text" class="user-input" name="username" placeholder="Type your username" required/>
            <input type="password" class="user-input" name="password" placeholder="Password" required/>
            <button type="submit" id="submit">Submit</button>
        </form>
        <script src="script.js"></script>
    </body>
</html>
